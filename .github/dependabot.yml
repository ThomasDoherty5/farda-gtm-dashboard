    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # Pinned on purpose: see docs/design-map.md.
      - dependency-name: "@fontsource/inter"
