name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: synthetic-original-layout-finance
          path: |
            test-results/**/finance-original-layout-demo-*.png
            test-results/**/finance-original-layout-demo-*.json
          if-no-files-found: ignore
          retention-days: 7

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: synthetic-original-layout-recruitment
          path: test-results/**/recruitment-original-layout-demo-*.png
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: synthetic-original-layout-traffic
          path: test-results/**/traffic-original-layout-demo-*.png
          if-no-files-found: ignore
          retention-days: 7

  agent-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Check finance control geometry before the complete browser suite
        run: npm run test:e2e:agent -- e2e-agent/finance-reads.spec.ts --grep 'native ledger header controls remain inside their panels'
      - run: npm run test:e2e:agent
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: synthetic-mirror-freshness
          path: test-results/agent/**/mirror-freshness-evidence/*
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: synthetic-agent-browser-evidence
          path: |
            test-results/agent/**/*.png
            !test-results/agent/**/weekly-kpi-trend-*.png
            test-results/agent/**/monitor-evidence/native-browser-proof.json
            test-results/agent/**/stock-support-evidence/accessibility.json
            test-results/agent/finance-operations/capture-manifest.json
            test-results/agent/**/attachments/header-geometry-*.json
          if-no-files-found: ignore
          retention-days: 7

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: synthetic-weekly-kpi-trend
          path: test-results/agent/**/weekly-kpi-trend-*.png
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: synthetic-acquisition-metric-evidence
          path: |
            test-results/agent/**/analytics-native-performance-1440.png
            test-results/agent/**/analytics-native-performance-390.png
            test-results/agent/**/analytics-native-paid-1440.png
            test-results/agent/**/analytics-native-paid-390.png
            test-results/agent/**/analytics-native-definitions-*.png
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: synthetic-native-read-review
          path: |
            test-results/agent/**/analytics-native-*.png
            test-results/agent/**/shipping-native-*.png
            test-results/agent/**/native-sourcing-plan-*.png
            test-results/agent/**/overview-owners-*.png
            test-results/agent/**/overview-launch-*.png
            test-results/agent/**/overview-owner-reconciliation.json
            test-results/agent/**/overview-detail-provenance.json
            test-results/agent/**/attachments/overview-owner-reconciliation-*.json
            test-results/agent/**/attachments/overview-detail-provenance-*.json
            test-results/agent/**/error-context.md
            test-results/agent/**/test-failed-*.png
          if-no-files-found: ignore
          retention-days: 7
